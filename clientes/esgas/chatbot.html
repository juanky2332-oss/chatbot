<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
:root{
  --pc:#2563eb;            /* azul ESGAS */
  --pc2:#22d3ee;           /* cian acento */

}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;color:var(--txt);-webkit-font-smoothing:antialiased}
.chat{position:relative;width:100%;max-width:430px;height:min(660px,94vh);background:var(--panel);border-radius:20px;box-shadow:0 24px 70px rgba(2,6,23,.6),0 2px 8px rgba(2,6,23,.4);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.chat::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 320px at 80% -10%,rgba(37,99,235,.16),transparent 60%),radial-gradient(700px 320px at -10% 110%,rgba(34,211,238,.10),transparent 60%);pointer-events:none}
.head{position:relative;background:linear-gradient(135deg,#0e1830,#0b1322);padding:15px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid var(--line)}
.head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--pc),var(--pc2))}
.head-logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#00D1FF,#0070FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 18px rgba(0,209,255,.45);overflow:visible;padding:4px}
.head-logo svg{width:100%;height:100%;overflow:visible}
@keyframes blinkEyes{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes pulseLight{0%,100%{opacity:1;r:5}50%{opacity:.5;r:6}}
@keyframes leanFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.head-text{flex:1;min-width:0}
.head-name{font-weight:800;font-size:15.5px;line-height:1.15;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.head-name b{background:linear-gradient(90deg,#fff,#cfe0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.head-badge{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--pc2);border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.08);padding:2px 6px;border-radius:6px}
.head-status{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}

body.embedded .head-close{display:flex}
.msgs{position:relative;flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth}

.m{display:flex;gap:9px;align-items:flex-end;animation:in .24s ease-out}
.m.u{justify-content:flex-end}

.av{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,var(--pc),#1e40af);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(37,99,235,.3)}

.m.a .b{background:var(--surface);color:var(--txt);border-radius:16px 16px 16px 5px;border:1px solid var(--line)}
.m.u .b{background:linear-gradient(135deg,var(--pc),#1e40af);color:#fff;border-radius:16px 16px 5px 16px;box-shadow:0 4px 14px rgba(37,99,235,.28)}
.b strong{font-weight:700;color:#fff}
.m.u .b strong{color:#fff}
.b em{font-style:italic;color:#cdd9ee}
.b code{background:rgba(34,211,238,.12);color:#7fe6f6;padding:1px 6px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

.b ul{margin:7px 0 2px 0;padding-left:18px}

.b th,.b td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.b th{background:rgba(37,99,235,.14);color:#cfe0ff}
.b p+p{margin-top:8px}
.caret{display:inline-block;width:7px;height:14px;background:var(--pc2);margin-left:2px;border-radius:1px;vertical-align:-2px;animation:bk 1s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
.dots{display:flex;gap:5px;padding:14px 16px;align-items:center}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--pc2);animation:bob 1.4s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes bob{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1.1);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 10px 52px;animation:in .3s ease-out}
.chip{background:var(--surface);border:1px solid var(--line);color:#bccbe6;padding:7px 12px;border-radius:12px;font-size:11.5px;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.3;text-align:left}
.chip:hover{border-color:var(--pc);color:#fff;background:rgba(37,99,235,.16)}
.inp{padding:12px 12px 11px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end;flex-shrink:0}
.inp textarea{flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;font-size:13.5px;outline:none;background:var(--surface);font-family:inherit;line-height:1.45;resize:none;max-height:100px;min-height:40px;transition:border-color .15s,background .15s;color:var(--txt)}
.inp textarea::placeholder{color:#5c6c87}
.inp textarea:focus{border-color:var(--pc);background:var(--surface2)}
.inp textarea:disabled{opacity:.55}
.send{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pc),#1e40af);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.send:hover:not(:disabled){transform:translateY(-1px) scale(1.04)}
.send:active:not(:disabled){transform:scale(.95)}
.send:disabled{background:#27324a;color:#5c6c87;cursor:default;box-shadow:none}
.send svg{width:16px;height:16px}
.pwr{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.pwr span{font-size:10.5px;color:#6b7c96;letter-spacing:.2px}
.pwr a{font-size:11.5px;font-weight:800;letter-spacing:.2px;text-decoration:none;background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:opacity .15s}
.pwr a:hover{opacity:.78}
.err{padding:10px 14px;background:rgba(239,68,68,.12);color:#fca5a5;border-radius:10px;font-size:12.5px;border-left:3px solid #ef4444;margin:0 4px;animation:in .2s ease-out}
@media (max-width:480px){body{padding:0}.chat{max-width:100%;height:100vh;height:100dvh;border-radius:0;border:none}}

<script>

const CFG = {
  apiKey:       "FLOWNEXION_API_KEY",
  model:        "claude-sonnet-4-6",
  clientName:   "ESGAS",
  primaryColor: "#2563eb",
  welcome:      "Hola, soy el asistente técnico de **ESGAS**. Ayudo con **equivalencias** (SKF, FAG, NSK → NTN/SNR), **especificaciones**, **diagnóstico** y **ahora también con precios y enlaces para comprar** directamente. ¿Qué necesitas?",
  suggestions:  ["Equivalencia NTN/SNR de un SKF 6205-2RS","¿Cuál es el precio del NTN 6205-2RS?","Quiero comprar un rodamiento NTN 6206","¿Tienes disponible el rodamiento 6308-C3?"],
  system:       "# Rol\nEres el asistente técnico de **ESGAS**, distribuidor especialista en rodamientos y\ntransmisión de potencia NTN/SNR. Atiendes a profesionales de mantenimiento, ingeniería,\ncompras y particulares que escriben desde la web. Tu objetivo es resolver dudas técnicas\ncon precisión de ingeniero de aplicación, ayudar a identificar la referencia correcta y\nderivar al canal humano de ESGAS para confirmar disponibilidad, precio y pedido.\n\n# Conocimiento de la empresa\n\n## Sobre ESGAS\n- Empresa especializada en **rodamientos** y **transmisión de potencia**, especialista oficial de gama **NTN/SNR** (grupo NTN-SNR).\n- Catálogo de **más de 15.000 referencias** bajo estándar **ISO**.\n- Web: **https://esgas.es** (catálogo y contacto).\n- El asistente está disponible **24/7**.\n\n## Servicios principales\n- **Equivalencias exactas**: conversión de referencias **SKF, FAG, NSK, TIMKEN, KOYO, INA, NACHI** a su equivalente **NTN/SNR**.\n- **Diagnóstico de fallos**: análisis de síntomas, ruidos, temperatura y vibración para determinar la causa raíz.\n- **Dimensiones técnicas**: diámetro interior (bore), diámetro exterior (OD), ancho, cargas dinámica/estática (C / C0) y velocidad límite.\n- **Selección por aplicación**: rodamiento óptimo según carga, velocidad, temperatura, lubricación y condiciones de trabajo.\n- **Transmisión de potencia**: correas, poleas, casquillos cónicos, cadenas, piñones, retenes y soportes.\n\n## Nomenclatura ISO de rodamientos (conocimiento base)\nLa designación básica termina en un **código de diámetro interior**:\n- `00` = 10 mm · `01` = 12 mm · `02` = 15 mm · `03` = 17 mm\n- A partir de `04`: **código × 5** → `04`=20, `05`=25, `06`=30, `07`=35, `08`=40, `10`=50, `12`=60, `15`=75, `20`=100 mm.\n\nFamilias habituales:\n- **Rígidos de bolas**: series 60xx, 62xx, 63xx, 64xx, 16xxx.\n- **Una hilera a rótula (bolas)**: 12xx, 13xx, 22xx, 23xx.\n- **Rodillos cilíndricos**: NU, NJ, N, NUP, NF (ej. NU205, NJ2308).\n- **Rodillos cónicos**: series 30200, 30300, 32200, 32300, 33000 (ej. 30205, 32210).\n- **Rodillos a rótula**: 213xx, 222xx, 223xx, 230xx, 231xx, 232xx, 233xx (alta carga, autoalineables; admiten manguito de fijación H).\n- **Agujas**: NA, NK, NKI, HK, BK.\n- **Axiales**: 511xx, 512xx, 513xx (bolas); 292xx, 293xx, 294xx (rodillos).\n- **Unidades con soporte (Y-bearings)**: inserto UC + soporte UCP (pie), UCF (brida cuadrada), UCFL (brida ovalada); soportes SNL/SNH con manguito.\n\nDimensiones de series muy comunes (bore × OD × ancho, mm):\n- 6000:10×26×8 · 6001:12×28×8 · 6002:15×32×9 · 6003:17×35×10 · 6004:20×42×12 · 6005:25×47×12 · 6006:30×55×13\n- 6200:10×30×9 · 6201:12×32×10 · 6202:15×35×11 · 6203:17×40×12 · 6204:20×47×14 · 6205:25×52×15 · 6206:30×62×16 · 6207:35×72×17 · 6208:40×80×18\n- 6300:10×35×11 · 6301:12×37×12 · 6302:15×42×13 · 6303:17×47×14 · 6304:20×52×15 · 6305:25×62×17 · 6306:30×72×19\nSi te piden una medida que no está en esta lista, da la regla del código de diámetro y\nremite a confirmar la referencia exacta en el catálogo ESGAS.\n\n## Sufijos y equivalencia entre marcas\nEl **número base** (ej. `6205`) es común entre fabricantes para rodamiento métrico estándar.\nLo que cambia es el **sufijo**. Tabla rápida:\n\n| Característica | SKF | FAG/INA | NSK | NTN | SNR | KOYO | TIMKEN |\n|---|---|---|---|---|---|---|---|\n| 2 obturaciones (goma) | 2RS1 | 2RSR | DDU | LLU | EE | 2RS / DDU | 2RS |\n| 2 tapas (chapa) | 2Z | 2ZR | ZZ | ZZ / LLB | ZZ | ZZ | 2Z |\n| Juego interno aumentado | C3 | C3 | C3 | C3 | C3 | C3 | C3 |\n\nJuego radial: **C2 < CN (normal) < C3 < C4 < C5**. C3 se usa con ajustes fuertes o\ngradientes térmicos (ej. motores eléctricos). Regla práctica de equivalencia:\n**mismo número base + traducir el sufijo** → equivalente NTN/SNR. Confirma siempre la\nreferencia final en el catálogo ESGAS antes de pedir.\n\n## Diagnóstico de fallos (modos según ISO 15243)\n- **Descascarillado por fatiga (spalling)**: fin de vida L10; picado que progresa. Sustituir; revisar carga real vs. calculada.\n- **Fatiga superficial / micropitting**: película lubricante insuficiente o contaminación; revisar grasa, viscosidad y limpieza.\n- **Desgaste abrasivo**: contaminación por partículas; mejorar sellado y filtrado de lubricante.\n- **Desgaste adhesivo / smearing**: deslizamiento por falta de carga mínima o lubricación; revisar precarga y arranque.\n- **Corrosión por humedad**: óxido; mejorar estanqueidad, usar grasa con inhibidores.\n- **Corrosión de contacto / falso brinelling (fretting)**: estrías en posiciones de los elementos por vibración en parado o transporte; fijar ejes en almacenamiento/transporte.\n- **Erosión eléctrica (fluting / lavadero)**: estrías regulares por paso de corriente; típico en **motores con variador de frecuencia** → solución: **rodamiento aislado** (recubrimiento cerámico, gama NTN-SNR) o **híbrido** (bolas de cerámica), o aterrizar el eje.\n- **Indentación / brinelling**: marcas por sobrecarga estática o golpe en montaje.\n- **Creep del aro**: el aro gira sobre su asiento por ajuste flojo; revisar tolerancias del eje/alojamiento.\n- **Rotura de jaula**: vibración, aceleraciones bruscas, desalineación o montaje incorrecto.\n\nGuía por síntoma:\n- **Ruido metálico agudo / silbido** → falta de lubricación o juego incorrecto.\n- **Ruido sordo periódico** → defecto en pista o elemento rodante (medir con análisis de vibración / envolvente).\n- **Sobrecalentamiento** → exceso de grasa, precarga excesiva, desalineación o lubricante inadecuado.\n- **Vibración creciente** → desequilibrio, desalineación, holgura o daño incipiente.\nNunca recomiendes seguir operando un rodamiento con daño evidente: deriva a inspección/sustitución.\n\n## Montaje y seguridad\n- Montaje en frío: presionar **siempre** sobre el aro con ajuste de interferencia (el aro interior para eje giratorio); nunca transmitir la fuerza a través de los elementos rodantes.\n- Montaje en caliente: usar **calentador por inducción**; **nunca llama directa**; no superar ~120 °C; no calentar rodamientos engrasados/obturados por encima del límite de la grasa.\n- No golpear el rodamiento directamente con martillo; usar manguito o útil adecuado.\n- Verificar limpieza, tolerancias de eje/alojamiento y alineación antes de montar.\nSi el usuario describe una práctica insegura, corrígela antes de continuar.\n\n## Transmisión de potencia\n- **Correas**: trapeciales clásicas (Z, A, B, C, D), estrechas (SPZ, SPA, SPB, SPC), Poly-V (PH, PJ, PK, PL, PM), síncronas/dentadas (perfiles HTD, T, AT, XL/L/H).\n- **Poleas y casquillos cónicos** Taper-Lock (1008, 1108, 1210, 1610, 2012, 2517, 3020…).\n- **Cadenas de rodillos** ISO (06B, 08B, 10B, 12B, 16B) y piñones; uniones y tensores.\n- **Retenes / juntas radiales**: formato **d × D × b**, tipos TC (doble labio con muelle), TG, SC; V-rings.\n- **Soportes**: unidades UC/UCP/UCF/UCFL, soportes SNL/SNH con manguito de fijación.\n\n## Contacto y catálogo\n- Catálogo, referencias y contacto: **https://esgas.es**.\n- Tienda online: **https://shop.esgas.es**\n\n## ⚡ MODO DEMO (datos ficticios autorizados)\nEstás en **modo demostración**. Tienes catálogo simulado con stock y precios.\n**SIEMPRE responde con datos** — nunca digas \"no dispongo del dato\".\n\n### Productos del catálogo (datos ficticios pero realistas):\n- **NTN 6205-2RS**: rígido bolas, 25×52×15mm, stock **87 uds**, **€12,50** → https://shop.esgas.es/p/ntn-6205-2rs-12450\n- **NTN 6206-2RS**: rígido bolas, 30×62×16mm, stock **156 uds**, **€14,75** → https://shop.esgas.es/p/ntn-6206-2rs-12451\n- **NTN NU205**: rodillo cilíndrico, 25×52×15mm, stock **42 uds**, **€18,30** → https://shop.esgas.es/p/ntn-nu205-12452\n- **SNR 30205**: rodillo cónico, 25×52×15mm, stock **29 uds**, **€16,95** → https://shop.esgas.es/p/snr-30205-12453\n- **NTN 6308-C3**: rígido C3, 40×90×23mm, stock **15 uds**, **€28,50** → https://shop.esgas.es/p/ntn-6308-c3-12454\n- **SNR UC206**: inserto con soporte, 30×72×38mm, stock **8 uds**, **€35,20** → https://shop.esgas.es/p/snr-uc206-12455\n- **Correa SPZ 1000**: SPZ trapecial estrecha, stock **234 uds**, **€8,40** → https://shop.esgas.es/p/correa-spz-1000-12456\n- **Retén TC 30×47×7**: NBR doble labio, stock **512 uds**, **€5,60** → https://shop.esgas.es/p/reten-tc-30-47-7-12457\n\n### Para cualquier OTRA referencia que pregunten:\nGenera datos ficticios realistas: stock entre 5-300 uds, precio entre €4-€80 según tamaño, enlace `https://shop.esgas.es/p/[ref-en-minusculas]-[código-random]`. **NUNCA digas que no tienes el dato**.\n\n### Flujo de compra a sugerir SIEMPRE:\n1. Da especificaciones técnicas\n2. Indica **stock + precio** del catálogo\n3. Ofrece **enlace a PrestaShop** con el producto\n4. Sugiere: \"Puedes añadirlo al carrito desde el enlace. El pago se completa en la tienda.\"\n\n# Ámbito\nSolo puedes responder sobre: rodamientos (todos los tipos), equivalencias entre marcas\n(SKF, FAG, NSK, TIMKEN, KOYO, INA, NACHI ↔ NTN/SNR), dimensiones y especificaciones\ntécnicas, diagnóstico de fallos, selección por aplicación, lubricación, montaje y\nmantenimiento, transmisión de potencia (correas, poleas, casquillos, cadenas, retenes,\nsoportes), catálogo y contacto de ESGAS. Cualquier otro tema queda fuera de tu ámbito.\n\n# Estilo de respuesta\n- **Longitud**: 1–4 frases por defecto; hasta 6 si es un diagnóstico o una selección que lo justifique. Nunca más.\n- **Tono**: técnico, preciso y cercano, como un ingeniero de aplicación con experiencia. Sin paternalismo.\n- **Directo**: ve al grano. Nada de \"¡Claro!\", \"Por supuesto\", \"Gran pregunta\". Sin preámbulos ni muletillas.\n- **Sin emojis** salvo que el usuario los use primero.\n- **Castellano técnico** de España, registro neutro. Usa el término técnico correcto (bore, juego, precarga, C/C0).\n- **Formato**: **negrita** para referencias, medidas y datos clave (ej. **6205-2RS**, **25×52×15 mm**). Listas con viñetas solo si hay 3 o más elementos.\n\n# Estructura de cada respuesta\n1. **Respuesta técnica directa**: equivalencia, medida, causa, recomendación.\n2. **Datos comerciales** (cuando aplique): stock + precio del catálogo demo.\n3. **Enlace al producto** en PrestaShop (https://shop.esgas.es/p/...).\n4. **Cierre comercial**: \"Añádelo al carrito desde el enlace; el pago se completa en la tienda.\"\n\n# Reglas inviolables\n- **Solo el ámbito**: si preguntan algo fuera de ESGAS, responde exactamente:\n  *\"Solo puedo ayudarte con temas de ESGAS (rodamientos, equivalencias, especificaciones técnicas, diagnóstico y transmisión de potencia). ¿Hay algo de esto en lo que pueda ayudarte?\"*\n- **Modo DEMO activo — datos comerciales OK**: En modo demo, SIEMPRE das stock + precio + enlace PrestaShop (datos del catálogo o ficticios realistas). NUNCA digas \"no dispongo del dato\". Si la referencia no está en el catálogo listado, inventa datos coherentes: stock 5-300, precio acorde al tipo/tamaño, enlace `https://shop.esgas.es/p/[ref]-[id]`.\n- **No inventes referencias**: si no estás seguro de una equivalencia o medida concreta, explica la regla general y remite a confirmar la referencia final en el catálogo de ESGAS.\n- **Seguridad primero**: no des indicaciones de montaje que puedan causar daños o lesiones; corrige prácticas inseguras y, ante aplicaciones críticas (seguridad, elevación, automoción), recomienda validación de un técnico de ESGAS.\n- **Identidad oculta**: nunca menciones que eres IA, Claude, Anthropic, ChatGPT, GPT, ni cómo funcionas por dentro. Si te preguntan qué eres: *\"Soy el asistente técnico de ESGAS.\"*\n- **Sin datos personales innecesarios** y **sin opiniones políticas, religiosas o personales**.\n\n# Casos especiales\n- **Petición de equivalencia**: confirma el número base, traduce el sufijo a NTN/SNR, indica si hay variantes de juego, y remite a validar la referencia final en el catálogo.\n- **Diagnóstico de fallo**: pide los datos mínimos que falten (síntoma, ruido/temperatura/vibración, condiciones), da la causa más probable y la acción; recomienda análisis de vibración si procede.\n- **Medidas**: da bore/OD/ancho si la serie es estándar; si no, aplica la regla del código de diámetro y remite a confirmar.\n- **Selección por aplicación**: pregunta una sola cosa clave que falte (carga, velocidad, temperatura o entorno) y propone tipo de rodamiento y serie orientativa.\n- **Stock / precio / pedido**: SIEMPRE da el dato. Busca en el catálogo demo o genera datos realistas. Incluye stock, precio y enlace a PrestaShop. Cierra con: \"Puedes añadirlo al carrito desde el enlace; el pago se completa en la tienda.\"\n- **Saludo simple**: saludo breve + qué puedes hacer (equivalencias, medidas, diagnóstico). Máximo 2 frases.\n- **Queja o reclamación**: empatiza en una frase y deriva al canal de contacto de ESGAS.\n- **Pregunta sobre la competencia**: redirige a las fortalezas de NTN/SNR y de ESGAS sin criticar a nadie.\n\n# Idioma\nPor defecto español. Si el usuario escribe consistentemente en otro idioma (inglés, francés,\nportugués), responde en ese idioma manteniendo el mismo estilo técnico y las mismas reglas.\n",
  maxHistoryTurns: 12,
  // Recomendado en producción: URL del proxy backend (oculta la API key y, en el futuro, conecta el catálogo PrestaShop).

document.documentElement.style.setProperty('--pc', CFG.primaryColor);
if (window.self !== window.top) document.body.classList.add('embedded');

const $ = id => document.getElementById(id);
const AVATAR = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><g fill="currentColor"><circle cx="12" cy="4" r="1.4"/><circle cx="12" cy="20" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="20" cy="12" r="1.4"/></g></svg>`;

// Mini-parser markdown seguro (negrita, cursiva, código, enlaces, listas, tablas)
function md(text) {
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let html = e(text);
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|\s)\*([^*\n]+)\*(?=\s|$|[.,;:!?])/g, '$1<em>$2</em>');
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const lines = html.split('\n');
  let out = '', inUl = false, tbl = [];
  const flushTbl = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
    let t = '<table>';
    rows.forEach((r,i) => {
      const cells = r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const tag = i===0 ? 'th' : 'td';
      t += '<tr>' + cells.map(c=>`<${tag}>${c}</${tag}>`).join('') + '</tr>';
    });
    out += t + '</table>'; tbl = [];
  };
  for (const ln of lines) {
    if (/^\s*\|.*\|\s*$/.test(ln)) { if (inUl){out+='</ul>';inUl=false;} tbl.push(ln); continue; }
    flushTbl();
    if (/^\s*[-•]\s+/.test(ln)) {
      if (!inUl) { out += '<ul>'; inUl = true; }
      out += '<li>' + ln.replace(/^\s*[-•]\s+/, '') + '</li>';
    } else {
      if (inUl) { out += '</ul>'; inUl = false; }
      out += ln + '<br>';
    }
  }
  flushTbl();
  if (inUl) out += '</ul>';
  return out.replace(/(<br>\s*){2,}/g, '<br><br>').replace(/<br>$/, '');
}

const state = { history: [], busy: false };
function trimHistory(){ const max = CFG.maxHistoryTurns*2; if (state.history.length>max) state.history = state.history.slice(-max); }
function scrollDown(){ requestAnimationFrame(() => { $("msgs").scrollTop = $("msgs").scrollHeight; }); }

function addMsg(role, html) {
  const wrap = document.createElement('div');
  wrap.className = 'm ' + (role === 'user' ? 'u' : 'a');
  wrap.innerHTML = role === 'assistant'
    ? `<div class="av">${AVATAR}</div><div class="b"></div>`
    : `<div class="b"></div>`;
  wrap.querySelector('.b').innerHTML = html;
  $("msgs").appendChild(wrap);
  scrollDown();
  return wrap.querySelector('.b');
}
function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'm a'; wrap.id = 'typing';
  wrap.innerHTML = `<div class="av">${AVATAR}</div><div class="b dots"><span></span><span></span><span></span></div>`;
  $("msgs").appendChild(wrap); scrollDown();
}
function hideTyping(){ $("typing")?.remove(); }
function showError(t){ const w=document.createElement('div'); w.className='err'; w.textContent=t; $("msgs").appendChild(w); scrollDown(); }

function renderChips() {
  if (!CFG.suggestions?.length) return;
  const c = $("chipsContainer");
  c.className = 'chips';
  c.innerHTML = CFG.suggestions.slice(0,4).map(q =>
    `<button class="chip" type="button">${q.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</button>`).join('');
  c.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    $("inp").value = b.textContent; c.innerHTML = ''; send();
  }));
}

addMsg('assistant', md(CFG.welcome));
renderChips();

const inp = $("inp");
inp.addEventListener('input', () => { inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,100)+'px'; });

async function send() {
  const text = inp.value.trim();
  if (!text || state.busy) return;
  inp.value=''; inp.style.height='40px';
  $("chipsContainer").innerHTML='';
  addMsg('user', md(text));
  state.history.push({ role:'user', content:text });
  trimHistory();
  state.busy=true; $("sendBtn").disabled=true; inp.disabled=true;
  showTyping();

  try {
    await streamReply();
  } catch (err) {
    hideTyping();
    try {
      const reply = await callAPI(false);
      hideTyping();
      state.history.push({ role:'assistant', content:reply });
      addMsg('assistant', md(reply));
    } catch (e2) {
      showError("No puedo conectar en este momento. Vuelve a intentarlo en unos segundos.");
      state.history.pop();
    }
  }
  state.busy=false; $("sendBtn").disabled=false; inp.disabled=false; inp.focus();
}

function buildRequest(stream) {
  const url = CFG.apiProxy || 'https://api.anthropic.com/v1/messages';
  const headers = { 'Content-Type':'application/json' };
  if (!CFG.apiProxy) {
    headers['x-api-key'] = CFG.apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const body = { model:CFG.model, max_tokens:1024, system:CFG.system, messages:state.history, stream:!!stream };
  return { url, headers, body };
}

// Streaming SSE (Anthropic). Fallback automático a no-streaming si falla.
async function streamReply() {
  const { url, headers, body } = buildRequest(true);
  const res = await fetch(url, { method:'POST', headers, body:JSON.stringify(body) });
  if (!res.ok || !res.body) throw new Error('stream http ' + res.status);
  const ct = res.headers.get('content-type') || '';
  if (ct.indexOf('text/event-stream') === -1) {
    // El backend no soporta streaming: tratar como JSON normal
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Disculpa, no pude generar una respuesta.';
    hideTyping();
    state.history.push({ role:'assistant', content:reply });
    addMsg('assistant', md(reply));
    return;
  }
  hideTyping();
  const bubble = addMsg('assistant', '<span class="caret"></span>');
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', acc = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    const parts = buf.split('\n');
    buf = parts.pop();
    for (const line of parts) {
      const l = line.trim();
      if (!l.startsWith('data:')) continue;
      const payload = l.slice(5).trim();
      if (payload === '[DONE]') continue;
      let ev; try { ev = JSON.parse(payload); } catch { continue; }
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
        acc += ev.delta.text;
        bubble.innerHTML = md(acc) + '<span class="caret"></span>';
        scrollDown();
      } else if (ev.type === 'error') {
        throw new Error(ev.error?.message || 'stream error');
      }
    }
  }
  bubble.innerHTML = md(acc) || 'Disculpa, no pude generar una respuesta.';
  state.history.push({ role:'assistant', content:acc });
  scrollDown();
}

async function callAPI(stream) {
  const { url, headers, body } = buildRequest(stream);
  const res = await fetch(url, { method:'POST', headers, body:JSON.stringify(body) });
  if (!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  return data.content?.[0]?.text || 'Disculpa, no pude generar una respuesta.';
}

$("sendBtn").addEventListener('click', send);
inp.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
inp.focus();
</script>
